name: Derleme

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: VLC ve Inno Setup kur
        shell: pwsh
        run: |
          choco install vlc innosetup -y --no-progress

      - name: Derle
        shell: pwsh
        run: packaging\build.ps1 -InstallDeps

      - uses: actions/upload-artifact@v4
        with:
          name: gamma-windows
          path: build/installer/*

      - name: Sürüm yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/installer/*
          generate_release_notes: true
